spring.application.name=College Resource Sharing Platform

# ── DataSource (H2 in-memory with MySQL compatibility for instant testing) ──────
spring.datasource.url=jdbc:h2:mem:college_resource_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── JPA / Hibernate ───────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=true

# ── JWT ───────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:Yv3KqP7nMxRzL2wFdTsGcAhUeJbNpX8mQgVkZiOlEuCfHjDrBs}
app.jwt.expiration-ms=86400000

# ── File Upload ───────────────────────────────────────────────
app.file.upload-dir=${FILE_UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB

# ── CORS ──────────────────────────────────────────────────────
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500}

# ── Server ────────────────────────────────────────────────────
server.port=8080
server.error.include-message=never
server.error.include-stacktrace=never

# ── Jackson ───────────────────────────────────────────────────
spring.jackson.serialization.fail-on-empty-beans=false

# ── Logging ───────────────────────────────────────────────────
logging.level.com.college=INFO
logging.level.org.springframework.security=WARN
